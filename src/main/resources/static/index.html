<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭点菜 · 临时测试台</title>
  <style>
    :root { --ink:#202522; --muted:#6d756e; --line:#e6e9e5; --paper:#f7f8f5; --white:#fff; --green:#2e6b4e; --green-soft:#e8f1eb; --amber:#a86926; --red:#a84238; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    header { background:#173c2c; color:white; padding:28px max(22px, calc((100% - 1180px)/2)); }
    .head { display:flex; justify-content:space-between; align-items:end; gap:24px; }
    h1,h2,h3,p { margin:0; } h1 { font-size:28px; letter-spacing:.2px; } .sub { margin-top:7px; color:#c9d9cf; font-size:14px; }
    .health { display:flex; align-items:center; gap:8px; color:#d9f2e2; font-size:13px; white-space:nowrap; } .dot { width:9px; height:9px; background:#77d99b; border-radius:50%; }
    main { max-width:1180px; margin:24px auto 60px; padding:0 22px; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr); gap:20px; }
    .panel { background:var(--white); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(35,49,40,.04); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 20px 14px; border-bottom:1px solid var(--line); } h2 { font-size:18px; } .hint { font-size:13px; color:var(--muted); }
    .menu-tools { display:flex; gap:8px; padding:14px 20px; border-bottom:1px solid var(--line); } select,input,textarea { border:1px solid #d8ded9; border-radius:5px; padding:9px 10px; font:inherit; color:var(--ink); background:#fff; } select { min-width:130px; } input:focus,select:focus,textarea:focus { outline:2px solid #c5e0ce; border-color:var(--green); }
    .dish-editor { display:none; grid-template-columns:1.1fr .8fr .6fr; gap:8px; padding:14px 20px; background:#fbfcfa; border-bottom:1px solid var(--line); } .dish-editor.open { display:grid; } .editor-actions { display:flex; gap:8px; grid-column:1 / -1; } .editor-actions button { min-width:86px; }
    button { border:0; border-radius:5px; padding:9px 13px; font:600 14px inherit; cursor:pointer; color:white; background:var(--green); } button:hover { filter:brightness(.94); } button.secondary { background:#eef2ee; color:#31533f; } button.ghost { background:transparent; color:var(--green); padding:6px 2px; } button.danger { background:#f9eae8; color:var(--red); }
    .dish-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:18px 20px 22px; } .dish { border:1px solid var(--line); border-radius:7px; padding:14px; display:flex; flex-direction:column; gap:9px; min-height:150px; } .dish-top { display:flex; justify-content:space-between; gap:10px; } .dish-name { font-weight:700; font-size:16px; } .tag { color:var(--green); background:var(--green-soft); border-radius:4px; padding:3px 7px; font-size:12px; white-space:nowrap; } .dish-desc { color:var(--muted); font-size:13px; min-height:19px; } .dish-bottom { margin-top:auto; display:flex; justify-content:space-between; align-items:center; } .sort { color:#9ba39c; font-size:12px; }
    .basket { padding-bottom:18px; } .basket-body { padding:16px 20px 0; } .basket-empty { color:var(--muted); padding:10px 0 16px; font-size:14px; } .basket-row { display:grid; grid-template-columns:1fr auto; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); } .basket-name { font-weight:600; font-size:14px; } .basket-note { color:var(--muted); font-size:12px; margin-top:4px; } .qty { display:flex; align-items:center; gap:8px; } .qty button { width:26px; height:26px; padding:0; border-radius:50%; font-size:17px; line-height:1; } .qty span { min-width:16px; text-align:center; }
    .form { padding:18px 20px 0; } .field { margin-bottom:12px; } label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; } textarea { width:100%; min-height:68px; resize:vertical; } .form input { width:100%; } .order-actions { display:flex; gap:8px; margin-top:14px; } .order-actions button { flex:1; }
    .orders { grid-column:1 / -1; } .order-list { padding:8px 20px 20px; } .order-card { border-bottom:1px solid var(--line); padding:16px 0; } .order-card:last-child { border-bottom:0; } .order-meta { color:var(--muted); font-size:13px; margin-top:5px; } .order-items { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; } .item-chip { background:#f2f4f1; border-radius:4px; padding:5px 8px; font-size:13px; }
    .toast { position:fixed; right:20px; bottom:20px; max-width:360px; background:#202522; color:white; padding:12px 15px; border-radius:6px; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; font-size:14px; } .toast.show { opacity:1; transform:none; } .toast.bad { background:var(--red); }
    @media (max-width:760px) { .head { align-items:start; flex-direction:column; gap:12px; } main { grid-template-columns:1fr; margin-top:16px; padding:0 12px; } .dish-list { grid-template-columns:1fr; padding:14px; } .panel-head,.menu-tools,.basket-body,.form,.order-list,.dish-editor { padding-left:14px; padding-right:14px; } .dish-editor { grid-template-columns:1fr 1fr; } .orders { grid-column:auto; } }
  </style>
</head>
<body>
  <header><div class="head"><div><h1>家庭点菜 · 测试台</h1><p class="sub">用现有接口走一遍“选菜 → 下单 → 厨房处理”</p></div><div class="health"><span class="dot"></span><span id="healthText">正在连接服务…</span></div></div></header>
  <main>
    <section class="panel">
      <div class="panel-head"><div><h2>今日菜单</h2><p class="hint">只展示当前供应中的菜品</p></div><div style="display:flex;gap:8px"><button class="secondary" id="openDishEditor">新增菜品</button><button class="secondary" id="refreshDishes">刷新</button></div></div>
      <div class="menu-tools"><select id="category"><option value="">全部分类</option></select></div>
      <div class="dish-editor" id="dishEditor"><input id="dishName" placeholder="菜名"><input id="dishCategory" placeholder="分类"><input id="dishSort" type="number" min="0" placeholder="排序"><div class="editor-actions"><button id="saveDish">保存菜品</button><button class="secondary" id="cancelDishEditor">取消</button><span class="hint" id="editorTitle" style="align-self:center">新增后默认上架</span></div></div>
      <div class="dish-list" id="dishList"></div>
    </section>
    <section class="panel basket"><div class="panel-head"><div><h2>点菜篮</h2><p class="hint" id="basketCount">还没有选择菜品</p></div></div><div class="basket-body"><div id="basketList" class="basket-empty">从左侧菜单添加菜品</div><div class="form"><div class="field"><label for="customerName">点菜人</label><input id="customerName" value="我" maxlength="30"></div><div class="field"><label for="orderRemark">订单备注</label><textarea id="orderRemark" maxlength="200" placeholder="例如：六点开饭"></textarea></div><div class="order-actions"><button id="submitOrder">提交订单</button><button class="secondary" id="clearBasket">清空</button></div></div></div></section>
    <section class="panel orders"><div class="panel-head"><div><h2>历史订单</h2><p class="hint">按提交时间倒序查看</p></div><button class="secondary" id="refreshOrders">刷新</button></div><div id="orderList" class="order-list"></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    var basket = {};
    function request(url, options) { return fetch(url, options || {}).then(function(r) { return r.json().then(function(body) { if (!r.ok || !body.success) { var d=body.data; throw new Error(d && d.message ? d.message : (body.message || '请求失败')); } return body.data; }); }); }
    function toast(message, bad) { var el=document.getElementById('toast'); el.textContent=message; el.className='toast show'+(bad?' bad':''); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(function(){el.className='toast';},2600); }
    function loadDishes() { request('/api/dishes').then(function(dishes) { window.dishes=dishes; var cats=[]; dishes.forEach(function(d){if(cats.indexOf(d.category)<0)cats.push(d.category);}); var select=document.getElementById('category'); var old=select.value; select.innerHTML='<option value="">全部分类</option>'+cats.map(function(c){return '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>';}).join(''); select.value=old; renderDishes(); document.getElementById('healthText').textContent='服务在线 · '+(location.port || '80'); }).catch(function(e){document.getElementById('healthText').textContent='服务连接失败'; toast(e.message,true);}); }
    function renderDishes() { var category=document.getElementById('category').value; var list=(window.dishes||[]).filter(function(d){return !category || d.category===category;}); document.getElementById('dishList').innerHTML=list.length?list.map(function(d){return '<article class="dish"><div class="dish-top"><span class="dish-name">'+escapeHtml(d.name)+'</span><span class="tag">'+escapeHtml(d.category)+'</span></div><div class="dish-bottom"><span class="sort">排序 '+d.sort+'</span><div style="display:flex;gap:8px"><button class="secondary" onclick="editDish('+d.id+')">编辑</button><button class="danger" onclick="deleteDish('+d.id+')">删除</button><button onclick="addDish('+d.id+')">加入点菜篮</button></div></div></article>';}).join(''):'<p class="hint" style="padding:20px">暂无可供应菜品</p>'; }
    function openEditor(dish) { window.editingDishId=dish?dish.id:null; document.getElementById('dishEditor').className='dish-editor open'; document.getElementById('dishName').value=dish?dish.name:''; document.getElementById('dishCategory').value=dish?dish.category:''; document.getElementById('dishSort').value=dish?dish.sort:0; document.getElementById('editorTitle').textContent=dish?'编辑菜品 #'+dish.id:'新增后默认上架'; document.getElementById('dishName').focus(); }
    function editDish(id) { var dish=(window.dishes||[]).find(function(d){return d.id===id;}); if(dish)openEditor(dish); }
    function closeEditor() { window.editingDishId=null; document.getElementById('dishEditor').className='dish-editor'; }
    function saveDish() { var name=document.getElementById('dishName').value.trim(), category=document.getElementById('dishCategory').value.trim(); if(!name||!category){toast('菜名和分类不能为空',true);return;} var payload={name:name,category:category,sort:Number(document.getElementById('dishSort').value||0)}; var id=window.editingDishId; request(id?'/api/dishes/'+id:'/api/dishes',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(){toast(id?'菜品已更新':'菜品已新增');closeEditor();loadDishes();}).catch(function(e){toast(e.message,true);}); }
    function deleteDish(id) { var dish=(window.dishes||[]).find(function(d){return d.id===id;}); if(!dish || !window.confirm('确定删除菜品“'+dish.name+'”吗？'))return; request('/api/dishes/'+id,{method:'DELETE'}).then(function(){toast('菜品已删除');loadDishes();}).catch(function(e){toast(e.message,true);}); }
    function addDish(id) { var d=(window.dishes||[]).find(function(x){return x.id===id;}); if(!d)return; if(!basket[id])basket[id]={dish:d,quantity:0,remark:''}; basket[id].quantity++; renderBasket(); }
    function changeQty(id, delta) { if(!basket[id])return; basket[id].quantity+=delta; if(basket[id].quantity<=0)delete basket[id]; renderBasket(); }
    function renderBasket() { var keys=Object.keys(basket); document.getElementById('basketCount').textContent=keys.length?keys.reduce(function(n,k){return n+basket[k].quantity;},0)+' 份菜品':'还没有选择菜品'; var el=document.getElementById('basketList'); if(!keys.length){el.className='basket-empty';el.textContent='从左侧菜单添加菜品';return;} el.className=''; el.innerHTML=keys.map(function(k){var x=basket[k];return '<div class="basket-row"><div><div class="basket-name">'+escapeHtml(x.dish.name)+'</div><div class="basket-note">'+escapeHtml(x.dish.category)+'</div></div><div class="qty"><button class="secondary" onclick="changeQty('+k+',-1)">−</button><span>'+x.quantity+'</span><button onclick="changeQty('+k+',1)">+</button></div></div>';}).join(''); }
    function submitOrder() { var keys=Object.keys(basket); if(!keys.length){toast('请先选择菜品',true);return;} var customer=document.getElementById('customerName').value.trim(); if(!customer){toast('请填写点菜人',true);return;} var payload={customerName:customer,items:keys.map(function(k){return {dishId:Number(k),quantity:basket[k].quantity};}),remark:document.getElementById('orderRemark').value.trim()}; request('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(){toast('订单已提交');basket={};document.getElementById('orderRemark').value='';renderBasket();loadOrders();}).catch(function(e){toast(e.message,true);}); }
    function loadOrders() { request('/api/orders').then(function(orders){var el=document.getElementById('orderList'); if(!orders.length){el.innerHTML='<p class="hint" style="padding:16px 0">还没有订单</p>';return;} el.innerHTML=orders.map(function(o){return '<article class="order-card"><strong>#'+o.id+' · '+escapeHtml(o.customerName)+'</strong><span style="float:right"><button class="secondary" onclick="showOrderDetail('+o.id+')">详情</button> <button class="danger" onclick="deleteOrder('+o.id+')">删除</button></span><div class="order-meta">'+formatTime(o.createdAt)+(o.remark?' · '+escapeHtml(o.remark):'')+'</div><div class="order-items">'+o.items.map(function(i){return '<span class="item-chip">'+escapeHtml(i.dishName)+' × '+i.quantity+'</span>';}).join('')+'</div></article>';}).join('');}).catch(function(e){toast(e.message,true);}); }
    function showOrderDetail(id) { request('/api/orders/'+id).then(function(order){window.alert('订单 #'+order.id+'\n点菜人：'+order.customerName+'\n下单时间：'+formatTime(order.createdAt)+'\n菜品：'+order.items.map(function(i){return i.dishName+' × '+i.quantity+(i.remark?'（'+i.remark+'）':'');}).join('、')+(order.remark?'\n备注：'+order.remark:''));}).catch(function(e){toast(e.message,true);}); }
    function deleteOrder(id) { if(!window.confirm('确定删除订单 #'+id+' 吗？'))return; request('/api/orders/'+id,{method:'DELETE'}).then(function(){toast('订单已删除');loadOrders();}).catch(function(e){toast(e.message,true);}); }
    function formatTime(value) { if(!value)return ''; return value.replace('T',' ').substring(0,16); }
    function escapeHtml(value) { return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    document.getElementById('category').addEventListener('change',renderDishes); document.getElementById('refreshDishes').addEventListener('click',loadDishes); document.getElementById('refreshOrders').addEventListener('click',loadOrders); document.getElementById('submitOrder').addEventListener('click',submitOrder); document.getElementById('clearBasket').addEventListener('click',function(){basket={};renderBasket();}); document.getElementById('openDishEditor').addEventListener('click',function(){openEditor();}); document.getElementById('cancelDishEditor').addEventListener('click',closeEditor); document.getElementById('saveDish').addEventListener('click',saveDish); loadDishes(); loadOrders();
  </script>
</body>
</html>
