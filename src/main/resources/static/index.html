<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭点菜 · 临时测试台</title>
  <style>
    :root { --ink:#263244; --muted:#77808d; --line:#e7e2da; --paper:#f7f5f0; --white:#fffdfa; --blue:#2a9d8f; --blue-dark:#26354d; --blue-soft:#e3f2ef; --green:var(--blue); --green-soft:var(--blue-soft); --amber:#d18a3a; --red:#c75c5c; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    header { background:var(--blue-dark); color:white; padding:30px max(22px, calc((100% - 1180px)/2)); box-shadow:0 3px 0 rgba(42,157,143,.28); }
    .head { display:flex; justify-content:space-between; align-items:end; gap:24px; }
    h1,h2,h3,p { margin:0; } h1 { font-size:28px; letter-spacing:.2px; } .sub { margin-top:7px; color:#c9d9cf; font-size:14px; }
    .health { display:flex; align-items:center; gap:8px; color:#d9e8ff; font-size:13px; white-space:nowrap; } .dot { width:9px; height:9px; background:#70e1b0; border-radius:50%; }
    main { max-width:1180px; margin:24px auto 60px; padding:0 22px; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr); gap:20px; }
    .panel { background:var(--white); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(55,49,39,.07); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 20px 14px; border-bottom:1px solid var(--line); } h2 { font-size:18px; } .hint { font-size:13px; color:var(--muted); }
    .menu-tools { display:flex; gap:8px; padding:14px 20px; border-bottom:1px solid var(--line); } select,input,textarea { border:1px solid #d8ded9; border-radius:5px; padding:9px 10px; font:inherit; color:var(--ink); background:#fff; } select { min-width:130px; } input:focus,select:focus,textarea:focus { outline:2px solid #c5e0ce; border-color:var(--green); }
    .dish-editor { display:none; grid-template-columns:1.1fr .8fr .6fr; gap:8px; padding:14px 20px; background:#fbfcfa; border-bottom:1px solid var(--line); } .dish-editor.open { display:grid; } .editor-actions { display:flex; gap:8px; grid-column:1 / -1; } .editor-actions button { min-width:86px; } .image-field { display:flex; align-items:center; gap:8px; } .image-field input[type=file] { max-width:190px; padding:6px; } .image-preview { width:42px; height:42px; object-fit:cover; border-radius:5px; border:1px solid var(--line); display:none; }
    button { border:0; border-radius:7px; padding:9px 13px; font:600 14px inherit; cursor:pointer; color:white; background:var(--green); transition:transform .15s,box-shadow .15s; } button:hover { filter:brightness(.96); transform:translateY(-1px); box-shadow:0 4px 10px rgba(42,157,143,.18); } button.secondary { background:#edf0ed; color:#31534f; } button.ghost { background:transparent; color:var(--green); padding:6px 2px; } button.danger { background:#fae9e5; color:var(--red); }
    .dish-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding:20px; } .category-heading { grid-column:1 / -1; display:flex; align-items:center; gap:10px; margin-top:6px; padding:5px 0 0; color:var(--blue); font-size:15px; font-weight:800; } .category-heading:after { content:""; height:1px; flex:1; background:var(--line); } .dish { border:1px solid var(--line); border-radius:10px; padding:13px; display:flex; flex-direction:column; gap:10px; min-height:160px; transition:transform .16s,box-shadow .16s,border-color .16s; } .dish:hover { transform:translateY(-3px); box-shadow:0 10px 22px rgba(42,157,143,.13); border-color:#b8ddd7; } .dish-top { display:flex; justify-content:space-between; gap:10px; } .dish-name { font-weight:800; font-size:16px; } .tag { color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:4px 8px; font-size:12px; white-space:nowrap; } .dish-bottom { margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:8px; } .sort { color:#9aa9bf; font-size:12px; }
    .basket { padding-bottom:18px; } .basket-body { padding:16px 20px 0; } .basket-empty { color:var(--muted); padding:10px 0 16px; font-size:14px; } .basket-row { display:grid; grid-template-columns:1fr auto; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); } .basket-name { font-weight:600; font-size:14px; } .basket-note { color:var(--muted); font-size:12px; margin-top:4px; } .qty { display:flex; align-items:center; gap:8px; } .qty button { width:26px; height:26px; padding:0; border-radius:50%; font-size:17px; line-height:1; } .qty span { min-width:16px; text-align:center; }
    .form { padding:18px 20px 0; } .field { margin-bottom:12px; } label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; } textarea { width:100%; min-height:68px; resize:vertical; } .form input { width:100%; } .order-actions { display:flex; gap:8px; margin-top:14px; } .order-actions button { flex:1; }
    .orders { grid-column:1 / -1; } .order-list { padding:8px 20px 20px; } .order-card { border-bottom:1px solid var(--line); padding:16px 0; } .order-card:last-child { border-bottom:0; } .order-meta { color:var(--muted); font-size:13px; margin-top:5px; } .order-items { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; } .item-chip { background:#f2f4f1; border-radius:4px; padding:5px 8px; font-size:13px; }
    .toast { position:fixed; right:20px; bottom:20px; max-width:360px; background:#202522; color:white; padding:12px 15px; border-radius:6px; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; font-size:14px; } .toast.show { opacity:1; transform:none; } .toast.bad { background:var(--red); }
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(20,32,25,.42); z-index:10; align-items:center; justify-content:center; padding:18px; } .modal-backdrop.open { display:flex; } .modal { width:min(620px,100%); max-height:min(720px,92vh); overflow:auto; background:#fff; border-radius:10px; box-shadow:0 18px 55px rgba(20,35,25,.22); } .modal-head { display:flex; justify-content:space-between; align-items:center; padding:20px 22px 14px; border-bottom:1px solid var(--line); } .modal-head h3 { font-size:18px; } .modal-close { background:transparent; color:var(--muted); font-size:22px; padding:2px 6px; } .category-form { display:grid; grid-template-columns:1fr 110px auto; gap:8px; padding:16px 22px; background:#fbfcfa; border-bottom:1px solid var(--line); } .category-row { display:grid; grid-template-columns:1fr 80px 70px auto; align-items:center; gap:10px; padding:13px 22px; border-bottom:1px solid var(--line); } .category-row:last-child { border-bottom:0; } .category-name { font-weight:600; } .category-meta { color:var(--muted); font-size:12px; } .switch { width:38px; height:22px; accent-color:var(--green); } .category-empty { padding:22px; color:var(--muted); }
    @media (max-width:760px) { .head { align-items:start; flex-direction:column; gap:12px; } main { grid-template-columns:1fr; margin-top:16px; padding:0 12px; } .dish-list { grid-template-columns:1fr; padding:14px; } .panel-head,.menu-tools,.basket-body,.form,.order-list,.dish-editor { padding-left:14px; padding-right:14px; } .dish-editor { grid-template-columns:1fr 1fr; } .orders { grid-column:auto; } }
    .dish-thumb { width:58px; height:58px; object-fit:cover; border-radius:8px; border:1px solid var(--line); flex:none; background:#edf3fc; } .dish-image-placeholder { width:58px; height:58px; border-radius:8px; background:#edf3fc; color:#91a1ba; display:flex; align-items:center; justify-content:center; font-size:11px; flex:none; } .admin-actions { display:none !important; } body.edit-mode .admin-actions { display:flex !important; }
    .dish button[onclick^="editDish"], .dish button[onclick^="deleteDish"], #manageCategories, #openDishEditor { display:none; } body.edit-mode .dish button[onclick^="editDish"], body.edit-mode .dish button[onclick^="deleteDish"], body.edit-mode #manageCategories, body.edit-mode #openDishEditor { display:inline-block; } .dish-top { align-items:center; } .tag { border-radius:6px; padding:3px 8px; } .dish { min-height:128px; padding:10px; } .dish-list { gap:10px; padding:16px; } .panel-head { padding-top:15px; padding-bottom:11px; } main { gap:16px; margin-top:18px; }
  </style>
</head>
<body>
  <header><div class="head"><div><h1> 丹丹的小厨房 </h1></div><div class="health"><span class="dot"></span><span id="healthText">正在连接服务…</span></div></div></header>
  <main>
    <section class="panel">
      <div class="panel-head"><div><h2>今日菜单</h2><p class="hint">按分类展示当前供应中的菜品</p></div><div style="display:flex;gap:8px"><button class="secondary" id="toggleEditMode">管理菜品</button><button class="secondary" id="manageCategories">管理类型</button><button class="secondary" id="openDishEditor">新增菜品</button><button class="secondary" id="refreshDishes">刷新</button></div></div>
      <div class="menu-tools"><select id="category"><option value="">全部分类</option></select></div>
      <div class="dish-editor" id="dishEditor"><input id="dishName" placeholder="菜名"><select id="dishCategory"><option value="">选择类型</option></select><input id="dishSort" type="number" min="0" placeholder="排序"><div class="image-field"><input id="dishImageFile" type="file" accept="image/*"><img id="dishImagePreview" class="image-preview" alt="菜品图片预览"><span class="hint">支持 JPG、PNG</span></div><div class="editor-actions"><button id="saveDish">保存菜品</button><button class="secondary" id="cancelDishEditor">取消</button><span class="hint" id="editorTitle" style="align-self:center">新增后默认上架</span></div></div>
      <div class="dish-list" id="dishList"></div>
    </section>
    <section class="panel basket"><div class="panel-head"><div><h2>点菜篮</h2><p class="hint" id="basketCount">还没有选择菜品</p></div></div><div class="basket-body"><div id="basketList" class="basket-empty">从左侧菜单添加菜品</div><div class="form"><div class="field"><label for="customerName">点菜人</label><input id="customerName" value="我" maxlength="30"></div><div class="field"><label for="orderRemark">备注</label><textarea id="orderRemark" maxlength="200" placeholder="例如：多加辣椒、不要香菜"></textarea></div><div class="order-actions"><button id="submitOrder">提交</button><button class="secondary" id="clearBasket">清空</button></div></div></div></section>
    <section class="panel orders"><div class="panel-head"><div><h2>历史订单</h2><p class="hint">按提交时间倒序查看</p></div><button class="secondary" id="refreshOrders">刷新</button></div><div id="orderList" class="order-list"></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <div id="categoryModal" class="modal-backdrop"><section class="modal"><div class="modal-head"><div><h3>菜品类型</h3><p class="hint">管理名称、展示顺序和启用状态</p></div><button class="modal-close" id="closeCategoryModal" aria-label="关闭">×</button></div><div class="category-form"><input id="newCategoryName" placeholder="新增类型名称"><input id="newCategorySort" type="number" min="0" placeholder="顺序"><button id="createCategory">新增</button></div><div id="categoryRows"></div></section></div>
  <script>
    var basket = {};
    function request(url, options) { return fetch(url, options || {}).then(function(r) { return r.json().then(function(body) { if (!r.ok || !body.success) { var d=body.data; throw new Error(d && d.message ? d.message : (body.message || '请求失败')); } return body.data; }); }); }
    function toast(message, bad) { var el=document.getElementById('toast'); el.textContent=message; el.className='toast show'+(bad?' bad':''); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(function(){el.className='toast';},2600); }
    function loadDishes() { request('/api/dishes').then(function(dishes) { window.dishes=dishes; renderDishes(); document.getElementById('healthText').textContent='服务在线 · '+(location.port || '80'); }).catch(function(e){document.getElementById('healthText').textContent='服务连接失败'; toast(e.message,true);}); }
    function loadCategories() { request('/api/dish-categories').then(function(cats){window.categories=cats;var select=document.getElementById('category'),old=select.value;select.innerHTML='<option value="">全部分类</option>'+cats.map(function(c){return '<option value="'+escapeHtml(c.name)+'">'+escapeHtml(c.name)+'</option>';}).join('');select.value=old;var dishSelect=document.getElementById('dishCategory'),dishOld=dishSelect.value;dishSelect.innerHTML='<option value="">选择类型</option>'+cats.map(function(c){return '<option value="'+escapeHtml(c.name)+'">'+escapeHtml(c.name)+'</option>';}).join('');dishSelect.value=dishOld;renderDishes();}).catch(function(e){toast(e.message,true);}); }
    function manageCategories() { request('/api/dish-categories?all=true').then(function(cats){var text=cats.map(function(c){return c.id+'. '+c.name+'（排序 '+c.sort+'，'+(c.enabled?'启用':'停用')+'）';}).join('\n');var action=window.prompt('类型管理：输入 n 新增、e 编辑、d 删除\n\n'+(text||'暂无类型'));if(!action)return;var parts=action.trim().split(/\s+/),type=parts[0];if(type==='n'){var name=window.prompt('类型名称');if(!name)return;var sort=window.prompt('展示顺序','0');request('/api/dish-categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,sort:Number(sort||0),enabled:true})}).then(function(){toast('类型已新增');loadCategories();}).catch(function(e){toast(e.message,true);});}else if(type==='e'){var id=Number(parts[1]||window.prompt('类型 ID'));var c=cats.find(function(x){return x.id===id;});if(!c)return;var name=window.prompt('类型名称',c.name);if(!name)return;var sort=window.prompt('展示顺序',c.sort);var enabled=window.confirm('确定启用该类型吗？');request('/api/dish-categories/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,sort:Number(sort||0),enabled:enabled})}).then(function(){toast('类型已更新');loadCategories();}).catch(function(e){toast(e.message,true);});}else if(type==='d'){var id=Number(parts[1]||window.prompt('类型 ID'));if(!id||!window.confirm('确定删除类型吗？（类型下有菜品时不能删除）'))return;request('/api/dish-categories/'+id,{method:'DELETE'}).then(function(){toast('类型已删除');loadCategories();}).catch(function(e){toast(e.message,true);});}}); }
    function renderDishes() { var category=document.getElementById('category').value; var list=(window.dishes||[]).filter(function(d){return !category || d.category===category;}); var groups=[]; list.forEach(function(d){var group=groups.find(function(g){return g.name===d.category;});if(!group){group={name:d.category,dishes:[]};groups.push(group);}group.dishes.push(d);}); groups.sort(function(a,b){var ac=(window.categories||[]).find(function(c){return c.name===a.name;}),bc=(window.categories||[]).find(function(c){return c.name===b.name;});return (ac?ac.sort:9999)-(bc?bc.sort:9999);}); var html=''; groups.forEach(function(g){html+='<div class="category-heading">'+escapeHtml(g.name)+'</div>'+g.dishes.map(function(d){return '<article class="dish"><div class="dish-top"><span class="dish-name">'+escapeHtml(d.name)+'</span><span class="tag">'+escapeHtml(d.category)+'</span></div><div class="dish-bottom"><span class="sort">排序 '+d.sort+'</span><div style="display:flex;gap:8px"><button class="secondary" onclick="editDish('+d.id+')">编辑</button><button class="danger" onclick="deleteDish('+d.id+')">删除</button><button onclick="addDish('+d.id+')">加入点菜篮</button></div></div></article>';}).join('');}); document.getElementById('dishList').innerHTML=html||'<p class="hint" style="padding:20px">暂无可供应菜品</p>'; decorateDishImages(); }
    function decorateDishImages(){document.querySelectorAll('.dish').forEach(function(card){var edit=card.querySelector('button[onclick^="editDish"]');if(!edit)return;var id=Number(edit.getAttribute('onclick').match(/\d+/)[0]),d=(window.dishes||[]).find(function(x){return x.id===id;}),top=card.querySelector('.dish-top');if(!d||!top||top.querySelector('.dish-thumb'))return;var image='<img class="dish-thumb" src="'+escapeHtml(d.imageUrl||'/default-dish.png')+'" onerror="this.src=\'/default-dish.png\'" alt="'+escapeHtml(d.name)+'">';top.insertAdjacentHTML('afterbegin',image);});}
    function openEditor(dish) { window.editingDishId=dish?dish.id:null; document.getElementById('dishEditor').className='dish-editor open'; document.getElementById('dishName').value=dish?dish.name:''; document.getElementById('dishCategory').value=dish?dish.category:''; document.getElementById('dishSort').value=dish?dish.sort:0; document.getElementById('dishImageFile').value=''; var preview=document.getElementById('dishImagePreview'); preview.src=dish&&dish.imageUrl?dish.imageUrl:'/default-dish.png'; preview.style.display='block'; document.getElementById('editorTitle').textContent=dish?'编辑菜品 #'+dish.id:'新增后默认上架'; document.getElementById('dishName').focus(); }
    function editDish(id) { var dish=(window.dishes||[]).find(function(d){return d.id===id;}); if(dish)openEditor(dish); }
    function closeEditor() { window.editingDishId=null; document.getElementById('dishEditor').className='dish-editor'; }
    function toggleEditMode(){document.body.classList.toggle('edit-mode');document.getElementById('toggleEditMode').textContent=document.body.classList.contains('edit-mode')?'退出管理':'管理菜品';}
    function uploadImage(file) { if(!file)return Promise.resolve(null); var form=new FormData();form.append('file',file);return request('/api/uploads/image',{method:'POST',body:form}); }
    function saveDish() { var name=document.getElementById('dishName').value.trim(), category=document.getElementById('dishCategory').value.trim(); if(!name||!category){toast('菜名和分类不能为空',true);return;} var current=(window.dishes||[]).find(function(d){return d.id===window.editingDishId;}),payload={name:name,category:category,sort:Number(document.getElementById('dishSort').value||0),imageUrl:current&&current.imageUrl?current.imageUrl:null}; var id=window.editingDishId; uploadImage(document.getElementById('dishImageFile').files[0]).then(function(url){if(url)payload.imageUrl=url;return request(id?'/api/dishes/'+id:'/api/dishes',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}).then(function(){toast(id?'菜品已更新':'菜品已新增');closeEditor();loadDishes();}).catch(function(e){toast(e.message,true);}); }
    function deleteDish(id) { var dish=(window.dishes||[]).find(function(d){return d.id===id;}); if(!dish || !window.confirm('确定删除菜品“'+dish.name+'”吗？'))return; request('/api/dishes/'+id,{method:'DELETE'}).then(function(){toast('菜品已删除');loadDishes();}).catch(function(e){toast(e.message,true);}); }
    function addDish(id) { var d=(window.dishes||[]).find(function(x){return x.id===id;}); if(!d)return; if(!basket[id])basket[id]={dish:d,quantity:0,remark:''}; basket[id].quantity++; renderBasket(); }
    function changeQty(id, delta) { if(!basket[id])return; basket[id].quantity+=delta; if(basket[id].quantity<=0)delete basket[id]; renderBasket(); }
    function renderBasket() { var keys=Object.keys(basket); document.getElementById('basketCount').textContent=keys.length?keys.reduce(function(n,k){return n+basket[k].quantity;},0)+' 份菜品':'还没有选择菜品'; var el=document.getElementById('basketList'); if(!keys.length){el.className='basket-empty';el.textContent='从左侧菜单添加菜品';return;} el.className=''; el.innerHTML=keys.map(function(k){var x=basket[k];return '<div class="basket-row"><div><div class="basket-name">'+escapeHtml(x.dish.name)+'</div><div class="basket-note">'+escapeHtml(x.dish.category)+'</div></div><div class="qty"><button class="secondary" onclick="changeQty('+k+',-1)">−</button><span>'+x.quantity+'</span><button onclick="changeQty('+k+',1)">+</button></div></div>';}).join(''); }
    function submitOrder() { var keys=Object.keys(basket); if(!keys.length){toast('请先选择菜品',true);return;} var customer=document.getElementById('customerName').value.trim(); if(!customer){toast('请填写点菜人',true);return;} var payload={customerName:customer,items:keys.map(function(k){return {dishId:Number(k),quantity:basket[k].quantity};}),remark:document.getElementById('orderRemark').value.trim()}; request('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(){toast('订单已提交');basket={};document.getElementById('orderRemark').value='';renderBasket();loadOrders();}).catch(function(e){toast(e.message,true);}); }
    function loadOrders() { request('/api/orders').then(function(orders){var el=document.getElementById('orderList'); if(!orders.length){el.innerHTML='<p class="hint" style="padding:16px 0">还没有订单</p>';return;} el.innerHTML=orders.map(function(o){return '<article class="order-card"><strong>#'+o.id+' · '+escapeHtml(o.customerName)+'</strong><span style="float:right"><button class="secondary" onclick="showOrderDetail('+o.id+')">详情</button> <button class="danger" onclick="deleteOrder('+o.id+')">删除</button></span><div class="order-meta">'+formatTime(o.createdAt)+(o.remark?' · '+escapeHtml(o.remark):'')+'</div><div class="order-items">'+o.items.map(function(i){return '<span class="item-chip">'+escapeHtml(i.dishName)+' × '+i.quantity+'</span>';}).join('')+'</div></article>';}).join('');}).catch(function(e){toast(e.message,true);}); }
    function showOrderDetail(id) { request('/api/orders/'+id).then(function(order){window.alert('订单 #'+order.id+'\n点菜人：'+order.customerName+'\n下单时间：'+formatTime(order.createdAt)+'\n菜品：'+order.items.map(function(i){return i.dishName+' × '+i.quantity+(i.remark?'（'+i.remark+'）':'');}).join('、')+(order.remark?'\n备注：'+order.remark:''));}).catch(function(e){toast(e.message,true);}); }
    function deleteOrder(id) { if(!window.confirm('确定删除订单 #'+id+' 吗？'))return; request('/api/orders/'+id,{method:'DELETE'}).then(function(){toast('订单已删除');loadOrders();}).catch(function(e){toast(e.message,true);}); }
    function formatTime(value) { if(!value)return ''; return value.replace('T',' ').substring(0,16); }
    function escapeHtml(value) { return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    document.getElementById('dishImageFile').addEventListener('change',function(){var p=document.getElementById('dishImagePreview'),f=this.files[0];if(f){p.src=URL.createObjectURL(f);p.style.display='block';}else{p.style.display='none';}});
    document.getElementById('toggleEditMode').addEventListener('click',toggleEditMode);
    function openCategoryModal(){document.getElementById('categoryModal').className='modal-backdrop open';renderCategoryRows();}
    function closeCategoryModal(){document.getElementById('categoryModal').className='modal-backdrop';}
    function renderCategoryRows(){var rows=document.getElementById('categoryRows'),cats=window.categoriesAll||[];rows.innerHTML=cats.length?cats.map(function(c){return '<div class="category-row"><div><div class="category-name">'+escapeHtml(c.name)+'</div><div class="category-meta">类型 #'+c.id+'</div></div><input class="category-sort" data-id="'+c.id+'" type="number" min="0" value="'+c.sort+'"><label class="category-meta"><input class="switch category-enabled" data-id="'+c.id+'" type="checkbox" '+(c.enabled?'checked':'')+'> 启用</label><div style="display:flex;gap:6px"><button class="secondary category-save" data-id="'+c.id+'">保存</button><button class="danger category-delete" data-id="'+c.id+'">删除</button></div></div>';}).join(''):'<div class="category-empty">还没有菜品类型，请先新增一个。</div>';rows.querySelectorAll('.category-save').forEach(function(b){b.onclick=function(){var c=cats.find(function(x){return x.id===Number(b.dataset.id);}),name=window.prompt('类型名称',c.name);if(!name)return;request('/api/dish-categories/'+c.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,sort:Number(rows.querySelector('.category-sort[data-id="'+c.id+'"]').value||0),enabled:rows.querySelector('.category-enabled[data-id="'+c.id+'"]').checked})}).then(function(){toast('类型已保存');refreshCategoryData();}).catch(function(e){toast(e.message,true);});};});rows.querySelectorAll('.category-delete').forEach(function(b){b.onclick=function(){if(!window.confirm('确定删除这个类型吗？类型下有菜品时不能删除。'))return;request('/api/dish-categories/'+b.dataset.id,{method:'DELETE'}).then(function(){toast('类型已删除');refreshCategoryData();}).catch(function(e){toast(e.message,true);});};});}
    function refreshCategoryData(){request('/api/dish-categories?all=true').then(function(c){window.categoriesAll=c;loadCategories();loadDishes();renderCategoryRows();});}
    document.getElementById('category').addEventListener('change',renderDishes); document.getElementById('refreshDishes').addEventListener('click',function(){loadCategories();loadDishes();}); document.getElementById('manageCategories').addEventListener('click',function(){refreshCategoryData();openCategoryModal();}); document.getElementById('closeCategoryModal').addEventListener('click',closeCategoryModal); document.getElementById('categoryModal').addEventListener('click',function(e){if(e.target===this)closeCategoryModal();}); document.getElementById('createCategory').addEventListener('click',function(){var n=document.getElementById('newCategoryName').value.trim();if(!n){toast('请输入类型名称',true);return;}request('/api/dish-categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,sort:Number(document.getElementById('newCategorySort').value||0),enabled:true})}).then(function(){document.getElementById('newCategoryName').value='';toast('类型已新增');refreshCategoryData();}).catch(function(e){toast(e.message,true);});}); document.getElementById('refreshOrders').addEventListener('click',loadOrders); document.getElementById('submitOrder').addEventListener('click',submitOrder); document.getElementById('clearBasket').addEventListener('click',function(){basket={};renderBasket();}); document.getElementById('openDishEditor').addEventListener('click',function(){openEditor();}); document.getElementById('cancelDishEditor').addEventListener('click',closeEditor); document.getElementById('saveDish').addEventListener('click',saveDish); loadCategories(); loadDishes(); loadOrders();
  </script>
</body>
</html>
